<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS函数</title>
</head>
<body>
    <!-- 写一个随机数的猜数游戏，计算机随机给出一定范围的随机数，学生输入猜测的数字，
     计算机给出数字大了或者小了，直到猜中或者到达指定的猜测次数 -->
     <button onclick="gessNum()">猜猜我是几？</button>
     <script>
        // 匿名函数
        var gessNum = function () { 
            // Math.floor是取整，Math.random()是[0,1)的随机数
             let num = getRandomNum(1, 25);
             let count = 0; // 猜测次数
             while (count < 5) {
                let input = prompt("请输入1~25之间的数字，你还有" + (5 - count) + "次机会");
                
                // 用户点取消，直接结束游戏
                if(input === null){
                    alert("你取消了游戏，正确答案是：" + num);
                    return;
                }

                input = parseInt(input);
                if (isNaN(input)) {
                    alert("请输入有效的数字！本次不算消耗次数");
                    continue;
                }
                // 增加范围校验
                if(input <1 || input>25){
                    alert("数字必须在1~25之间！本次不算消耗次数");
                    continue;
                }

                if (input > num) {
                    alert("太大了！");
                } else if (input < num) {
                    alert("太小了！");
                } else {
                    alert("恭喜你，猜对了！");
                    return;
                }
                // 只有输入合法数字猜错，才消耗次数
                count++;
             }
             alert("游戏结束，次数用完！正确答案是：" + num);
        }
// 获取从min到max的随机数
// 箭头函数
        var getRandomNum = (min, max) => {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
     </script>
</body>
</html>
