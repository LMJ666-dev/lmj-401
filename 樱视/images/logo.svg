<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" width="48" height="32">
  <defs>
    <radialGradient id="sak" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFD1DC"/>
      <stop offset="0.6" stop-color="#FB7299"/>
      <stop offset="1" stop-color="#e85a82"/>
    </radialGradient>
  </defs>
  <!-- 五片圆润花瓣，每片顶端有樱花小凹口，围绕中心 (24,16) -->
  <g fill="url(#sak)" stroke="#fff" stroke-width="0.8" stroke-linejoin="round">
    <!-- 上瓣 -->
    <path d="M24 16 C21 12, 19 8, 22 5.5 C23 4.8, 25 4.8, 26 5.5 C29 8, 27 12, 24 16 Z"/>
    <!-- 右上瓣 -->
    <path d="M24 16 C21 12, 19 8, 22 5.5 C23 4.8, 25 4.8, 26 5.5 C29 8, 27 12, 24 16 Z" transform="rotate(72 24 16)"/>
    <!-- 右下瓣 -->
    <path d="M24 16 C21 12, 19 8, 22 5.5 C23 4.8, 25 4.8, 26 5.5 C29 8, 27 12, 24 16 Z" transform="rotate(144 24 16)"/>
    <!-- 左下瓣 -->
    <path d="M24 16 C21 12, 19 8, 22 5.5 C23 4.8, 25 4.8, 26 5.5 C29 8, 27 12, 24 16 Z" transform="rotate(216 24 16)"/>
    <!-- 左上瓣 -->
    <path d="M24 16 C21 12, 19 8, 22 5.5 C23 4.8, 25 4.8, 26 5.5 C29 8, 27 12, 24 16 Z" transform="rotate(288 24 16)"/>
  </g>
  <!-- 中心花蕊：白色小圆 + 粉色小点 -->
  <circle cx="24" cy="16" r="2.2" fill="#fff"/>
  <circle cx="24" cy="16" r="1" fill="#FB7299"/>
</svg>
