<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 樱视 SakuraSee | 梁铭巨 24002120401</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="liang-nav">
    <a href="../index.html" class="liang-nav__logo">
      <img src="../images/logo.svg?v=4" alt="logo" width="36" height="24">
      <span>樱视 SakuraSee</span>
    </a>
  </header>

  <div class="liang-login-wrap">
    <div class="liang-login-box">
      <h1>樱视 SakuraSee 登录</h1>
      <p style="text-align:center;color:#9499A0;font-size:13px;margin-bottom:16px">欢迎回来，请登录你的账号</p>
      <form onsubmit="return liangDoLogin(event)">
        <label style="display:block;margin:12px 0 4px;color:#61666D;font-size:13px">账号</label>
        <input id="liang-login-user" type="text" placeholder="请输入账号"
               style="width:100%;padding:9px 12px;border:1px solid #E3E5E7;border-radius:6px">
        <label style="display:block;margin:12px 0 4px;color:#61666D;font-size:13px">密码</label>
        <input id="liang-login-pass" type="password" placeholder="请输入密码"
               style="width:100%;padding:9px 12px;border:1px solid #E3E5E7;border-radius:6px">
        <button class="liang-btn" type="submit" style="width:100%;justify-content:center;margin-top:20px">登 录</button>
      </form>
    </div>
  </div>

  <script>
    function liangDoLogin(e) {
      e.preventDefault();
      const u = document.getElementById("liang-login-user").value.trim();
      const p = document.getElementById("liang-login-pass").value.trim();
      if (!u || !p) { alert("请输入账号和密码"); return false; }
      alert("演示登录成功，正在跳转到首页…");
      location.href = "../index.html";
      return false;
    }
  </script>

    <span>直播</span>
  </a>
