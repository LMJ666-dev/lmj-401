  功能名称：任务三 · 图片查看器 —— 双指缩放 + 双击 + 拖动
           验收①两指中心不跳  验收②边界限制  验收③1x 不能拖  验收④旋转屏幕不丢
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>任务三 · 图片查看器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f0f1a; color: #fff;
      min-height: 100vh;
      padding: 20px 16px 40px;
    }
    #lmj_homeLink {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(255,255,255,0.1);
      color: #fff; text-decoration: none;
      border-radius: 20px; font-size: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 16px;
    }
    .lmj_hdr { text-align: center; margin-bottom: 14px; }
    .lmj_hdr h1 { font-size: 20px; letter-spacing: 2px; }
    .lmj_hdr p  { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 6px; }

    /* ===== 验收可视化面板 ===== */
    .lmj_accept {
      max-width: 420px; margin: 0 auto 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 12px 14px;
      font-size: 11px; line-height: 1.6;
    }
    .lmj_accept h3 { font-size: 12px; color: #ffd166; margin-bottom: 8px; letter-spacing: 1px; }
    .lmj_accept code {
      background: rgba(255,255,255,0.1); padding: 1px 5px;
      border-radius: 3px; font-size: 10px; font-family: Consolas, monospace;
    }
    .lmj_accept-row {
      display: flex; justify-content: space-between; align-items: center;
      margin: 3px 0; color: rgba(255,255,255,0.6);
    }
    .lmj_accept-row b { color: #06d6a0; font-weight: normal; }

    /* 验收①两指中点对齐 meter */
    .lmj_align-meter {
      background: rgba(255,255,255,0.1);
      height: 4px; border-radius: 2px; overflow: hidden; margin-top: 2px;
    }
    .lmj_align-fill {
      height: 100%; width: 0; transition: width 0.05s linear;
    }
    .lmj_align-fill.lmj_ok { background: #06d6a0; }
    .lmj_align-fill.lmj_bad { background: #ef476f; }

    /* ===== 查看器 ===== */
    #lmj_viewer {
      width: 100%; max-width: 420px;
      height: 480px;
      margin: 0 auto;
      background: #1a1a2e;
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;           /* 整个容器接管手势（验收②的前提） */
      user-select: none;
      -webkit-touch-callout: none;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    /* 两指中点十字标记（验收①证明） */
    .lmj_crosshair {
      position: absolute; width: 24px; height: 24px;
      pointer-events: none; z-index: 10;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .lmj_crosshair.lmj_show { opacity: 1; }
    .lmj_crosshair::before,
    .lmj_crosshair::after {
      content: ''; position: absolute; background: #06d6a0;
    }
    .lmj_crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    .lmj_crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

    /* 图片 */
    #lmj_img {
      position: absolute;
      top: 50%; left: 50%;
      height: 100%; width: auto;
      max-width: none;
      transform-origin: 0 0;
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
      will-change: transform;
      pointer-events: none;
    }
    #lmj_img.lmj_noAnim { transition: none; }

    /* ===== 底部信息栏 ===== */
    .lmj_footer {
      max-width: 420px; margin: 14px auto 0;
      display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
      font-size: 12px; color: rgba(255,255,255,0.5);
    }
    .lmj_footer b { color: #ffd166; font-weight: normal; }
    .lmj_reset {
      background: rgba(255,255,255,0.1);
      color: #fff; border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 18px; border-radius: 18px; font-size: 12px;
      cursor: pointer; margin-top: 8px;
    }
    .lmj_reset:active { background: rgba(255,255,255,0.25); }

    /* 提示横幅（桌面无触摸时） */
    .lmj_tip {
      max-width: 420px; margin: 0 auto 12px;
      background: linear-gradient(90deg, #ffd166, #ff9f1c);
      color: #1a1a2e; padding: 8px 16px; border-radius: 18px;
      text-align: center; font-size: 12px;
    }
    .lmj_tip.lmj_hidden { display: none; }
  </style>
</head>
<body>
  <a id="lmj_homeLink" href="index.html">← 返回首页</a>

  <div class="lmj_hdr">
    <h1>图片查看器 · 任务三</h1>
    <p>验收①两指不跳 验收②边界限制 验收③1x 不能拖 验收④旋转屏幕不丢</p>
  </div>

  <!-- 验收可视化面板 -->
  <div class="lmj_accept">
    <h3>🔍 验收点实时读数</h3>
    <div class="lmj_accept-row">
      <span>验收① 两指中点对齐（Δpx）</span>
      <span id="lmj_alignText"><b>—</b></span>
    </div>
    <div class="lmj_align-meter"><div class="lmj_align-fill" id="lmj_alignFill"></div></div>
    <div class="lmj_accept-row" style="margin-top:8px;">
      <span>验收② 当前缩放 scale</span>
      <span><b id="lmj_scaleText">1.00x</b> （限制 1~4x）</span>
    </div>
    <div class="lmj_accept-row">
      <span>验收③ 平移 tx / ty</span>
      <span id="lmj_txText"><b>0 / 0</b></span>
    </div>
    <div class="lmj_accept-row">
      <span>验收④ localStorage 状态</span>
      <span id="lmj_saveText"><b>已保存</b></span>
    </div>
  </div>

  <!-- 提示横幅 -->
  <div class="lmj_tip" id="lmj_tip">📱 双指缩放请用手机（或浏览器设备模式 Ctrl+Shift+M）</div>

  <!-- 查看器 -->
  <div id="lmj_viewer">
    <!-- 两指中点十字（验收①可视化） -->
    <div class="lmj_crosshair" id="lmj_cross"></div>
    <img id="lmj_img"
         src="lmj_zoom_img.jpg"
         alt="风景">
  </div>

  <!-- 底部信息 -->
  <div class="lmj_footer">
    <span>双击 <b>1x ↔ 2x</b></span>
    <span>缩放 <b>1x ~ 4x</b></span>
    <span>放大后 <b>单指拖动</b></span>
  </div>
  <div style="text-align:center;margin-top:8px;">
    <button class="lmj_reset" id="lmj_resetBtn">重置</button>
  </div>

  <script>
    // 任务三：图片查看器
    // 核心状态
    var lmj_scale = 1;
    var lmj_min = 1, lmj_max = 4;
    var lmj_tx = 0, lmj_ty = 0;

    // 过程变量
    var lmj_mode = 0;               // 0 空闲 / 1 单指 / 2 双指
    var lmj_startX = 0, lmj_startY = 0, lmj_startTx = 0, lmj_startTy = 0;
    var lmj_lastTap = 0;

    // 双指缩放专用 —— 验收①核心：保证"两指中点不跳"
    var lmj_initDist = 0;            // 两指初始距离
    var lmj_initScale = 1;           // 初始 scale
    var lmj_initMidX = 0, lmj_initMidY = 0;  // 两指初始中点（容器坐标）
    var lmj_initImgX = 0, lmj_initImgY = 0;  // 图片上对应中点的点坐标（相对图片中心的偏移，单位：图片像素）
    var lmj_alignDrift = 0;          // 验收①可视化：对齐漂移像素

    var lmj_viewer = document.getElementById('lmj_viewer');
    var lmj_img = document.getElementById('lmj_img');
    var lmj_scaleText = document.getElementById('lmj_scaleText');
    var lmj_txText = document.getElementById('lmj_txText');
    var lmj_alignText = document.getElementById('lmj_alignText');
    var lmj_alignFill = document.getElementById('lmj_alignFill');
    var lmj_saveText = document.getElementById('lmj_saveText');
    var lmj_resetBtn = document.getElementById('lmj_resetBtn');
    var lmj_tip = document.getElementById('lmj_tip');
    var lmj_cross = document.getElementById('lmj_cross');

    // ===== 工具函数 =====
    function lmj_dist(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }
    function lmj_mid(t1, t2) {
      var r = lmj_viewer.getBoundingClientRect();
      return {
        x: ((t1.clientX + t2.clientX) / 2) - r.left,
        y: ((t1.clientY + t2.clientY) / 2) - r.top
      };
    }
    function lmj_clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    // ===== 渲染 =====
    function lmj_apply(noAnim) {
      if (noAnim) lmj_img.classList.add('lmj_noAnim');
      lmj_img.style.transform =
        'translate(calc(-50% + ' + lmj_tx + 'px), calc(-50% + ' + lmj_ty + 'px)) scale(' + lmj_scale + ')';
      if (noAnim) { void lmj_img.offsetWidth; lmj_img.classList.remove('lmj_noAnim'); }
      lmj_scaleText.textContent = lmj_scale.toFixed(2) + 'x';
      lmj_txText.textContent = Math.round(lmj_tx) + ' / ' + Math.round(lmj_ty);
    }

    // 函数功能：边界限制 —— 验收②（clamp scale）+ 验收③（1x 时 tx/ty 必为 0）
    function lmj_clampAll() {
      lmj_scale = lmj_clamp(lmj_scale, lmj_min, lmj_max);

      var r = lmj_viewer.getBoundingClientRect();
      // 图片尺寸（容器高 = viewer.height，宽按比例）
      var nh = r.height;
      var nw = lmj_img.naturalWidth / lmj_img.naturalHeight * nh;

      // 缩放后尺寸
      var sw = nw * lmj_scale, sh = nh * lmj_scale;

      // 溢出量
      var ox = Math.max(0, sw - r.width);
      var oy = Math.max(0, sh - r.height);

      // 验收③：scale<=1 时 tx/ty 必归零（不能拖出边界）
      if (lmj_scale <= 1) { lmj_tx = 0; lmj_ty = 0; return; }

      // 验收②：边界限制（对称约束，保证中心不跑偏）
      lmj_tx = lmj_clamp(lmj_tx, -ox / 2, ox / 2);
      lmj_ty = lmj_clamp(lmj_ty, -oy / 2, oy / 2);
    }

    // ===== 验收④：localStorage 持久化 scale/tx/ty =====
    var LMJ_SAVE_KEY = 'lmj_zoom_state_v3';
    function lmj_saveState() {
      try {
        localStorage.setItem(LMJ_SAVE_KEY, JSON.stringify({
          s: lmj_scale, tx: lmj_tx, ty: lmj_ty, t: Date.now()
        }));
        lmj_saveText.innerHTML = '<b style="color:#06d6a0;">已保存 ✓</b>';
      } catch (e) {}
    }
    function lmj_restoreState() {
      try {
        var raw = localStorage.getItem(LMJ_SAVE_KEY);
        if (!raw) return;
        var o = JSON.parse(raw);
        // 只在最近 10 分钟内的状态才恢复（防长时间后图片内容变了导致错位）
        if (Date.now() - (o.t || 0) > 600000) return;
        lmj_scale = lmj_clamp(o.s, lmj_min, lmj_max);
        lmj_tx = o.tx || 0; lmj_ty = o.ty || 0;
        lmj_restoreState._restored = true;
        lmj_saveText.innerHTML = '<b style="color:#06d6a0;">已从 localStorage 恢复 ✓</b>';
      } catch (e) {}
    }
    // 旋转屏 / resize 事件（验收④核心）
    window.addEventListener('resize', function () {
      lmj_clampAll(); lmj_apply(true); lmj_saveState();
    });
    window.addEventListener('orientationchange', function () {
      // iOS 旋转屏
      setTimeout(function () { lmj_clampAll(); lmj_apply(true); lmj_saveState(); }, 200);
    });

    // ===== touchstart =====
    lmj_viewer.addEventListener('touchstart', function (e) {
      e.preventDefault();

      if (e.touches.length === 1) {
        // 单指：记录拖动起点
        lmj_mode = 1;
        var r = lmj_viewer.getBoundingClientRect();
        lmj_startX = e.touches[0].clientX - r.left;
        lmj_startY = e.touches[0].clientY - r.top;
        lmj_startTx = lmj_tx; lmj_startTy = lmj_ty;
      } else if (e.touches.length >= 2) {
        // 双指：验收①核心 —— 记录"缩放前两指中点对应的图片点"
        lmj_mode = 2;
        lmj_initDist = lmj_dist(e.touches[0], e.touches[1]);
        lmj_initScale = lmj_scale;
        var mid = lmj_mid(e.touches[0], e.touches[1]);
        lmj_initMidX = mid.x; lmj_initMidY = mid.y;

        // 关键推导（验收①"不跳"的数学基础）：
        //
        // 图片以容器中心 + tx/ty 定位，scale 从图片中心向四周扩张：
        //   图片中心在容器内坐标 = containerW/2 + tx
        //   图片上某个"原始点" imgX（相对图片中心的偏移，单位：图片像素）
        //   缩放后这个原始点在容器内坐标 = containerW/2 + tx + imgX * scale
        //
        // 我们要保证"两指中点始终对齐图片上的原始点"：
        //   当前两指中点 midX = containerW/2 + tx + imgX * scale
        //   解出 imgX：
        //     imgX = (midX - containerW/2 - tx) / scale
        var r2 = lmj_viewer.getBoundingClientRect();
        lmj_initImgX = (mid.x - r2.width  / 2 - lmj_tx) / lmj_scale;
        lmj_initImgY = (mid.y - r2.height / 2 - lmj_ty) / lmj_scale;

        // 显示十字标记（验收①可视化）
        lmj_cross.style.left = lmj_initMidX + 'px';
        lmj_cross.style.top  = lmj_initMidY + 'px';
        lmj_cross.classList.add('lmj_show');
      }
    }, { passive: false });

    // ===== touchmove =====
    lmj_viewer.addEventListener('touchmove', function (e) {
      e.preventDefault();

      if (lmj_mode === 1 && e.touches.length === 1) {
        // 单指拖动
        var r = lmj_viewer.getBoundingClientRect();
        var x = e.touches[0].clientX - r.left;
        var y = e.touches[0].clientY - r.top;
        lmj_tx = lmj_startTx + (x - lmj_startX);
        lmj_ty = lmj_startTy + (y - lmj_startY);
        lmj_apply(true);
      } else if (lmj_mode === 2 && e.touches.length >= 2) {
        // 双指缩放（验收①核心）
        var curDist = lmj_dist(e.touches[0], e.touches[1]);
        if (lmj_initDist > 0) {
          var ratio = curDist / lmj_initDist;
          var newScale = lmj_initScale * ratio;
          newScale = lmj_clamp(newScale, lmj_min, lmj_max);

          // 新中点
          var mid2 = lmj_mid(e.touches[0], e.touches[1]);
          var r3 = lmj_viewer.getBoundingClientRect();

          // 验收①核心公式：
          // 两指中点必须始终对齐"缩放前记录的图片原始点"：
          //   midX_new = containerW/2 + tx_new + imgX * newScale
          //   解出 tx_new：
          //     tx_new = midX_new - containerW/2 - imgX * newScale
          lmj_scale = newScale;
          lmj_tx = mid2.x - r3.width  / 2 - lmj_initImgX * lmj_scale;
          lmj_ty = mid2.y - r3.height / 2 - lmj_initImgY * lmj_scale;

          lmj_apply(true);

          // 验收①可视化：十字跟随新中点，计算漂移
          lmj_cross.style.left = mid2.x + 'px';
          lmj_cross.style.top  = mid2.y + 'px';
          // 理论漂移：由于 tx_new 是精确解，漂移应为 0
          // 我们用"图片点是否还在中点下"来证明
          var expectedX = r3.width  / 2 + lmj_tx + lmj_initImgX * lmj_scale;
          var expectedY = r3.height / 2 + lmj_ty + lmj_initImgY * lmj_scale;
          lmj_alignDrift = Math.hypot(expectedX - mid2.x, expectedY - mid2.y);
          lmj_alignText.innerHTML = '<b>' + lmj_alignDrift.toFixed(2) + ' px</b>（应为 0）';
          var pct = Math.min(100, lmj_alignDrift * 100);
          lmj_alignFill.style.width = pct + '%';
          lmj_alignFill.className = 'lmj_align-fill ' + (lmj_alignDrift < 0.5 ? 'lmj_ok' : 'lmj_bad');
        }
      }
    }, { passive: false });

    // ===== touchend =====
    lmj_viewer.addEventListener('touchend', function (e) {
      e.preventDefault();

      // 还有手指 —— 切单指
      if (e.touches.length === 1 && lmj_mode === 2) {
        lmj_mode = 1;
        var r = lmj_viewer.getBoundingClientRect();
        lmj_startX = e.touches[0].clientX - r.left;
        lmj_startY = e.touches[0].clientY - r.top;
        lmj_startTx = lmj_tx; lmj_startTy = lmj_ty;
        lmj_cross.classList.remove('lmj_show');
        return;
      }
      if (e.touches.length > 0) return;

      // 全抬起
      lmj_mode = 0;
      lmj_cross.classList.remove('lmj_show');

      // 验收②③：边界限制 + 回弹（带过渡动画）
      lmj_clampAll();
      lmj_apply(false);

      // 验收④：保存状态
      lmj_saveState();

      // 双击检测 —— 验收②双击 1x↔2x 过渡
      var now = Date.now();
      if (now - lmj_lastTap < 300) {
        if (lmj_scale < 1.5) { lmj_scale = 2; lmj_tx = 0; lmj_ty = 0; }
        else                 { lmj_scale = 1; lmj_tx = 0; lmj_ty = 0; }
        lmj_apply(false);       // 带 0.25s 过渡
        lmj_saveState();
        lmj_lastTap = 0;
      } else {
        lmj_lastTap = now;
      }
    }, { passive: false });

    // touchcancel
    lmj_viewer.addEventListener('touchcancel', function (e) {
      lmj_mode = 0;
      lmj_cross.classList.remove('lmj_show');
      lmj_clampAll(); lmj_apply(true); lmj_saveState();
    });

    // 重置按钮
    lmj_resetBtn.addEventListener('click', function () {
      lmj_scale = 1; lmj_tx = 0; lmj_ty = 0;
      lmj_apply(false);
      try { localStorage.removeItem(LMJ_SAVE_KEY); lmj_saveText.innerHTML = '<b>已清除</b>'; } catch (e) {}
    });

    // 设备检测
    function lmj_check() {
      if (!('ontouchstart' in window) && navigator.maxTouchPoints === 0)
        lmj_tip.classList.remove('lmj_hidden');
      // 验收④：图片加载后尝试恢复
      if (lmj_img.complete) lmj_restoreState();
      else lmj_img.addEventListener('load', lmj_restoreState);
      lmj_apply(false);
    }
    lmj_img.addEventListener('load', lmj_check);
    if (lmj_img.complete) lmj_check();
  </script>
</body>
</html>
