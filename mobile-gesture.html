<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>手势卡片 · 中华美食</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", serif;
      background: #1a1a2e;
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }

    /* 首页入口 */
    #lmj_homeLink {
      align-self: flex-start;
      display: inline-block;
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #lmj_homeLink:hover { background: rgba(255,255,255,0.2); }

    h1 { font-size: 22px; letter-spacing: 3px; margin-bottom: 6px; }
    .lmj_sub { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 30px; }

    /* 卡片容器 —— pan-y：纵向还能滚，横向归我 */
    #lmj_cardWrap {
      width: 100%;
      max-width: 380px;
      height: 480px;
      position: relative;
      touch-action: pan-y;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* 单张卡片 */
    .lmj_card {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  opacity 0.3s ease;
      opacity: 0;
      transform: translateX(100%);
    }
    .lmj_card.lmj_active { opacity: 1; transform: translateX(0); z-index: 2; }
    .lmj_card.lmj_prev { opacity: 0; transform: translateX(-100%); z-index: 1; }
    .lmj_card.lmj_next { opacity: 0; transform: translateX(100%); z-index: 1; }
    .lmj_card.lmj_dragging { transition: none; }

    .lmj_card h2 {
      font-size: 32px;
      margin-bottom: 14px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .lmj_card p {
      font-size: 15px;
      line-height: 1.8;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }
    .lmj_card .lmj_tag {
      position: absolute;
      top: 30px;
      left: 30px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* 指示器 */
    .lmj_counter {
      margin-top: 24px;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 2px;
    }
    .lmj_dots {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .lmj_dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: all 0.3s;
    }
    .lmj_dot.lmj_current {
      background: #ffd166;
      width: 22px;
      border-radius: 4px;
    }

    /* 边界提示 */
    .lmj_toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }
    .lmj_toast.lmj_show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .lmj_hint {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <a id="lmj_homeLink" href="index.html">← 返回首页</a>

  <h1>中华美食卡片</h1>
  <p class="lmj_sub">← 左滑下一道 · 右滑上一道 →</p>

  <div id="lmj_cardWrap">
    <!-- 卡片由 JS 生成 -->
  </div>

  <div class="lmj_counter"><span id="lmj_idx">1</span> / <span id="lmj_total">4</span></div>
  <div class="lmj_dots" id="lmj_dots"></div>

  <p class="lmj_hint">📱 请用手机或浏览器设备模式体验</p>

  <div class="lmj_toast" id="lmj_toast">已经是第一张啦</div>

  <script>
    // 任务二 · 手势卡片
    // 数据：4 道中华美食
    var lmj_foods = [
      { name: '麻婆豆腐', desc: '麻辣鲜香的川菜经典，嫩滑豆腐裹着红油酱汁，配以花椒的麻与豆瓣的香，入口层次丰富，下饭神器。', tag: '川菜 · 四川', bg: 'linear-gradient(135deg,#ff6b6b,#c0392b)' },
      { name: '北京烤鸭', desc: '皮脆肉嫩的京菜代表，果木炭火慢烤，鸭皮金黄酥脆，配以甜面酱、葱白、黄瓜丝，用薄饼卷着吃。', tag: '京菜 · 北京', bg: 'linear-gradient(135deg,#f39c12,#d35400)' },
      { name: '小笼包', desc: '皮薄馅大、汤汁鲜美的上海名点，轻咬慢吸，鲜美的肉汤在口中散开，配上姜丝和香醋更是绝配。', tag: '沪菜 · 上海', bg: 'linear-gradient(135deg,#27ae60,#16a085)' },
      { name: '东坡肉', desc: '苏东坡创制的浙菜名菜，选用五花肉慢炖而成，色泽红亮、入口即化，肥而不腻，瘦而不柴。', tag: '浙菜 · 杭州', bg: 'linear-gradient(135deg,#9b59b6,#6c3483)' }
    ];

    var lmj_threshold = 40;       // 滑动阈值（px）
    var lmj_cooldown = 300;       // 冷却时间（ms），防止连滑跳两张
    var lmj_index = 0;            // 当前卡片索引
    var lmj_startX = 0;           // 触摸起点 X
    var lmj_startY = 0;           // 触摸起点 Y
    var lmj_currentX = 0;         // 当前触摸 X
    var lmj_isDragging = false;   // 是否正在拖动
    var lmj_cooldownTimer = 0;    // 冷却计时器

    var lmj_wrap = document.getElementById('lmj_cardWrap');
    var lmj_idxEl = document.getElementById('lmj_idx');
    var lmj_totalEl = document.getElementById('lmj_total');
    var lmj_dotsEl = document.getElementById('lmj_dots');
    var lmj_toast = document.getElementById('lmj_toast');

    // 函数功能：初始化 —— 生成卡片 DOM 和底部圆点指示器
    function lmj_init() {
      lmj_totalEl.textContent = lmj_foods.length;

      // 生成卡片
      lmj_foods.forEach(function (food, i) {
        var card = document.createElement('div');
        card.className = 'lmj_card';
        card.style.background = food.bg;
        card.innerHTML =
          '<span class="lmj_tag">' + food.tag + '</span>' +
          '<h2>' + food.name + '</h2>' +
          '<p>' + food.desc + '</p>';
        lmj_wrap.appendChild(card);

        // 生成圆点
        var dot = document.createElement('span');
        dot.className = 'lmj_dot';
        lmj_dotsEl.appendChild(dot);
      });

      lmj_updateUI();
    }

    // 函数功能：根据当前索引更新卡片位置、计数器、圆点高亮
    function lmj_updateUI() {
      var cards = lmj_wrap.querySelectorAll('.lmj_card');
      cards.forEach(function (c, i) {
        c.classList.remove('lmj_active', 'lmj_prev', 'lmj_next', 'lmj_dragging');
        if (i === lmj_index) c.classList.add('lmj_active');
        else if (i < lmj_index) c.classList.add('lmj_prev');
        else c.classList.add('lmj_next');
      });

      var dots = lmj_dotsEl.querySelectorAll('.lmj_dot');
      dots.forEach(function (d, i) {
        d.classList.toggle('lmj_current', i === lmj_index);
      });

      lmj_idxEl.textContent = lmj_index + 1;
    }

    // 函数功能：显示边界提示 toast（1.2s 后自动隐藏）
    function lmj_showToast(msg) {
      lmj_toast.textContent = msg;
      lmj_toast.classList.add('lmj_show');
      clearTimeout(lmj_showToast._t);
      lmj_showToast._t = setTimeout(function () {
        lmj_toast.classList.remove('lmj_show');
      }, 1200);
    }

    // 函数功能：冷却检查 —— 在冷却期内返回 true 阻止切换
    function lmj_inCooldown() {
      if (lmj_cooldownTimer > Date.now()) return true;
      lmj_cooldownTimer = Date.now() + lmj_cooldown;
      return false;
    }

    // 函数功能：触摸开始 —— 记录起点坐标
    lmj_wrap.addEventListener('touchstart', function (e) {
      if (lmj_inCooldown()) return;
      var t = e.touches[0];
      lmj_startX = t.clientX;
      lmj_startY = t.clientY;
      lmj_currentX = t.clientX;
      lmj_isDragging = true;
      var cards = lmj_wrap.querySelectorAll('.lmj_card');
      cards.forEach(function (c) { c.classList.add('lmj_dragging'); });
    }, { passive: true });

    // 函数功能：触摸移动 —— 实时跟手拖动当前卡片（无动画）
    lmj_wrap.addEventListener('touchmove', function (e) {
      if (!lmj_isDragging) return;
      var t = e.touches[0];
      lmj_currentX = t.clientX;
      var dx = lmj_currentX - lmj_startX;

      var active = lmj_wrap.querySelector('.lmj_card.lmj_active');
      if (active) active.style.transform = 'translateX(' + dx + 'px)';

      // 同时让相邻卡片也跟手露出来
      var show = dx > 0 ? lmj_wrap.querySelector('.lmj_card.lmj_prev')
                       : lmj_wrap.querySelector('.lmj_card.lmj_next');
      if (show) {
        var showOffset = dx > 0 ? (-100 + dx / 4) + '%' : (100 + dx / 4) + '%';
        show.style.transform = 'translateX(' + showOffset + ')';
        show.style.opacity = Math.min(1, Math.abs(dx) / 100);
      }
    }, { passive: true });

    // 函数功能：触摸结束 —— 计算位移，判断是否切换卡片或回弹
    lmj_wrap.addEventListener('touchend', function (e) {
      if (!lmj_isDragging) return;
      lmj_isDragging = false;

      var dx = lmj_currentX - lmj_startX;
      var dy = lmj_startY - (e.changedTouches[0].clientY); // 纵向位移（不用于切换，只用于判断方向）
      var absX = Math.abs(dx);
      var absY = Math.abs(dy);

      // 先恢复所有卡片的内联样式（让 CSS 过渡接管）
      var cards = lmj_wrap.querySelectorAll('.lmj_card');
      cards.forEach(function (c) {
        c.style.transform = '';
        c.style.opacity = '';
        c.classList.remove('lmj_dragging');
      });

      // 纵向滑动优先交给页面，不触发切换
      if (absY > absX) return;

      if (absX < lmj_threshold) {
        // 距离不够，视为误触或点击 —— 回弹
        return;
      }

      if (dx < 0) {
        // 左滑 → 下一张
        if (lmj_index < lmj_foods.length - 1) {
          lmj_index++;
        } else {
          lmj_showToast('已经是最后一道啦 🎉');
        }
      } else {
        // 右滑 → 上一张
        if (lmj_index > 0) {
          lmj_index--;
        } else {
          lmj_showToast('已经是第一道啦 🥢');
        }
      }

      lmj_updateUI();
    });

    // 函数功能：触摸取消 —— 被系统打断时清理拖动状态
    lmj_wrap.addEventListener('touchcancel', function () {
      lmj_isDragging = false;
      var cards = lmj_wrap.querySelectorAll('.lmj_card');
      cards.forEach(function (c) {
        c.style.transform = '';
        c.style.opacity = '';
        c.classList.remove('lmj_dragging');
      });
    });

    lmj_init();
  </script>
</body>
</html>
